[project]
name = "credit-risk-scoring-engine"
version = "0.1.0"
description = "Algorithmic credit risk & working capital scoring engine using a T-GAT + XGBoost stacked ensemble on alternative transactional data."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.8",
    "xgboost>=2.1.1",
    "torch>=2.3.0",
    "scikit-learn>=1.5.1",
    "shap>=0.46.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "mlflow>=2.15.1",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "joblib>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fakeredis>=2.24.1",
    "ruff>=0.6.2",
    "mypy>=1.11.1",
    "pandas-stubs>=2.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection pattern relies on `Depends(...)` as an
# argument default; that's idiomatic FastAPI, not the mutable-default-arg
# bug B008 is meant to catch.
"src/credit_risk/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = "jax.*"
follow_imports = "skip"